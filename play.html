<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLIS - Acadèmia Platònica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --gold: #ffd700;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .cinzel { font-family: 'Cinzel', serif; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            border-radius: 12px;
        }

        .btn-option {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .btn-option:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }

        .draggable {
            cursor: grab;
            transition: transform 0.2s;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .dropzone {
            transition: background-color 0.2s;
        }
        .dropzone.hover {
            background-color: #e2e8f0;
            border-color: #3b82f6;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes popOut {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Noves animacions de feedback */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px) rotate(-2deg); }
            40%, 80% { transform: translateX(15px) rotate(2deg); }
        }
        .shake-anim {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5) !important;
            background-color: #fef2f2 !important;
        }
        .success-anim {
            border-color: #22c55e !important;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.6) !important;
            background-color: #f0fdf4 !important;
            transform: scale(1.05);
            transition: all 0.3s ease-out;
            z-index: 10;
        }

        .anim-pop {
            animation: popOut 0.5s ease-out forwards;
        }

        #victory-screen {
            display: none;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }
        #victory-screen.active {
            display: flex;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Header / HUD -->
    <header class="glass-panel w-full max-w-4xl p-4 flex justify-between items-center z-20 mb-8">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 tracking-wider cinzel">ACADÈMIA</h1>
            <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">Proves de la Raó</p>
        </div>
        
        <div class="flex gap-6 items-center">
            <div class="text-center bg-yellow-50 p-2 rounded-lg border border-yellow-200 shadow-inner">
                <p class="text-xs text-yellow-700 font-bold uppercase mb-1">Tresoreria</p>
                <p class="text-xl md:text-2xl font-bold text-yellow-600" id="ui-money">0 💰</p>
            </div>
            
            <button onclick="window.location.href='index.html'" class="px-6 py-3 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow-lg transition-transform hover:scale-105 flex items-center gap-2">
                <span>🔙</span> Tornar a la meva Polis
            </button>
        </div>
    </header>

    <!-- Game Area -->
    <main class="w-full max-w-4xl flex-grow flex flex-col items-center justify-center relative">
        <div id="game-container" class="glass-panel w-full p-8 shadow-2xl relative overflow-hidden transition-all duration-300">
            <!-- Content injected via JS -->
        </div>
    </main>

    <!-- Victory Modal -->
    <div id="victory-screen" class="fixed inset-0 z-50 justify-center items-center">
        <div class="glass-panel w-96 flex flex-col p-8 rounded-xl shadow-2xl text-center anim-pop border-4 border-yellow-400" style="box-shadow: 0 0 50px rgba(255, 215, 0, 0.4);">
            <h2 class="text-5xl mb-4 animate-bounce">🎉</h2>
            <h2 class="text-3xl cinzel font-bold text-gray-800 mb-2">Ment Brillant!</h2>
            <p class="text-gray-600 mb-6">Has demostrat la teva saviesa platònica.</p>
            <div class="bg-yellow-100 border-2 border-yellow-400 text-yellow-800 p-4 rounded-lg font-bold text-2xl mb-6 shadow-inner">
                +500 💰
            </div>
            <button onclick="nextGame()" class="w-full p-4 bg-green-500 text-white font-bold rounded-lg hover:bg-green-600 transition-colors shadow-lg text-xl flex items-center justify-center gap-2">
                Següent Prova 🧠
            </button>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let state = {
            money: 0,
            happiness: 100,
            grid: {},
            entities: []
        };
        const REWARD = 500;
        let currentGameIndex = -1;

        // --- GAME DATA ---
        const games = [
            {
                type: 'trivia',
                question: 'Al Mite de la Caverna, què representa el Sol exterior?',
                options: [
                    'La fama i el poder polític',
                    'La Idea de Bé, font de tota veritat',
                    'El foc creat pels sofistes',
                    'La ignorància dels mortals'
                ],
                correct: 1
            },
            {
                type: 'trivia',
                question: 'Segons el Símil de la Línia, quin tipus de coneixement correspon al Món Sensible (les coses físiques)?',
                options: [
                    'Doxa (Opinió)',
                    'Episteme (Ciència)',
                    'Noesi (Intuïció pura)',
                    'Matemàtiques'
                ],
                correct: 0
            },
            {
                type: 'trivia',
                question: 'A quina classe social correspon la virtut del Coratge (Valor) segons la República de Plató?',
                options: [
                    'Governants-Filòsofs',
                    'Artesans i Productors',
                    'Guardians o Guerrers',
                    'Esclaus'
                ],
                correct: 2
            },
            {
                type: 'trivia',
                question: 'Quin grup de pensadors criticava Plató pel seu relativisme i per cobrar per ensenyar a convèncer (retòrica)?',
                options: [
                    'Els Pitagòrics',
                    'Els Sofistes',
                    'Els Presocràtics',
                    'Els Epicuris'
                ],
                correct: 1
            },
            {
                type: 'trivia',
                question: 'Segons la teoria de la reminiscència de Plató, aprendre és en realitat...',
                options: [
                    'Memoritzar dades noves',
                    'Recordar el que l\'ànima ja sabia',
                    'Observar la natura amb els sentits',
                    'Obeir els déus cegament'
                ],
                correct: 1
            },
            {
                type: 'dnd',
                question: 'Emparella els conceptes del Mite de la Caverna amb el seu significat real:',
                pairs: [
                    { id: 'p1', term: 'Ombres', meaning: 'Falses creences / Món Sensible' },
                    { id: 'p2', term: 'Cadenes', meaning: 'Ignorància i Prejudicis' },
                    { id: 'p3', term: 'Sol', meaning: 'Idea suprema del Bé' }
                ]
            },
            {
                type: 'dnd',
                question: 'Emparella els elements del Mite del Carro Alat amb la part de l\'ànima que representen:',
                pairs: [
                    { id: 'c1', term: 'Cavall Blanc', meaning: 'Ànima Irascible (Coratge)' },
                    { id: 'c2', term: 'Cavall Negre', meaning: 'Ànima Concupiscible (Desitjos)' },
                    { id: 'c3', term: 'Auriga', meaning: 'Ànima Racional (Raó)' }
                ]
            }
        ];

        // --- INITIALIZATION ---
        function init() {
            loadGame();
            updateUI();
            loadRandomGame();
        }

        function loadGame() {
            const saved = localStorage.getItem('polis_cat_save_v2');
            if (saved) {
                try { 
                    state = JSON.parse(saved); 
                    // Asegurar que money es un número
                    if(typeof state.money !== 'number') state.money = 0;
                } catch(e) {
                    console.error("Error loading save data");
                }
            }
        }

        function saveState() {
            localStorage.setItem('polis_cat_save_v2', JSON.stringify(state));
            updateUI();
        }

        function updateUI() {
            document.getElementById('ui-money').innerText = `${Math.floor(state.money).toLocaleString()} 💰`;
        }

        // --- GAME ENGINE ---
        function loadRandomGame() {
            document.getElementById('victory-screen').classList.remove('active');
            
            // Pick a random game, but not the exact same one back to back if possible
            let nextIndex = currentGameIndex;
            while(nextIndex === currentGameIndex) {
                nextIndex = Math.floor(Math.random() * games.length);
            }
            currentGameIndex = nextIndex;
            const gameData = games[currentGameIndex];

            const container = document.getElementById('game-container');
            container.innerHTML = ''; // Clear

            if(gameData.type === 'trivia') {
                renderTrivia(container, gameData);
            } else if (gameData.type === 'dnd') {
                renderDnD(container, gameData);
            }
        }

        // --- TRIVIA LOGIC ---
        function renderTrivia(container, data) {
            let html = `
                <div class="text-center mb-8">
                    <span class="text-5xl mb-4 block">❓</span>
                    <h2 class="text-2xl cinzel font-bold text-gray-800 leading-relaxed">${data.question}</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="trivia-options">
            `;
            
            data.options.forEach((opt, index) => {
                html += `
                    <button onclick="checkTrivia(${index}, ${data.correct}, this)" class="btn-option p-5 bg-gray-50 border-2 border-gray-200 rounded-xl text-left shadow-sm hover:shadow-md text-gray-700 font-medium text-lg relative overflow-hidden transition-all duration-200">
                        ${opt}
                    </button>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function checkTrivia(selected, correct, btnElement) {
            const container = document.getElementById('game-container');
            
            // Disable all buttons immediately
            const allBtns = document.querySelectorAll('#trivia-options button');
            allBtns.forEach(btn => btn.disabled = true);

            if(selected === correct) {
                // Success visual highly enhanced
                btnElement.classList.add('success-anim', 'text-green-900', 'font-bold');
                container.style.boxShadow = "0 0 50px rgba(34, 197, 94, 0.4)";
                
                // Add a tick icon
                btnElement.innerHTML += ' <span class="absolute right-4 top-4 text-2xl animate-bounce">✅</span>';
                
                setTimeout(() => {
                    container.style.boxShadow = "";
                    triggerVictory();
                }, 1000);
            } else {
                // Wrong answer extremely visual
                btnElement.classList.add('shake-anim', 'text-red-900', 'font-bold');
                btnElement.innerHTML += ' <span class="absolute right-4 top-4 text-2xl">❌</span>';
                container.classList.add('shake-anim');
                
                // Highlight the correct one softly to teach the user
                allBtns[correct].classList.add('border-green-400', 'bg-green-50', 'text-green-800');
                allBtns[correct].innerHTML += ' <span class="absolute right-4 top-4 text-2xl opacity-50">✔️</span>';

                setTimeout(() => {
                    container.classList.remove('shake-anim');
                    // Automatically load a new game after failing
                    setTimeout(() => {
                        loadRandomGame();
                    }, 1800);
                }, 400);
            }
        }

        // --- DRAG AND DROP LOGIC ---
        let dndMatches = 0;
        let totalDndPairs = 0;

        function renderDnD(container, data) {
            dndMatches = 0;
            totalDndPairs = data.pairs.length;
            
            // Shuffle terms and meanings independently
            let terms = [...data.pairs].sort(() => Math.random() - 0.5);
            let meanings = [...data.pairs].sort(() => Math.random() - 0.5);

            let html = `
                <div class="text-center mb-6">
                    <span class="text-5xl mb-4 block">🧩</span>
                    <h2 class="text-xl cinzel font-bold text-gray-800">${data.question}</h2>
                    <p class="text-sm text-gray-600 mt-3 font-medium bg-blue-50 inline-block px-4 py-2 rounded-full border border-blue-200">Arrossega els conceptes de l'esquerra al seu significat correcte a la dreta.</p>
                </div>
                <div class="flex flex-col md:flex-row gap-8 justify-between w-full">
                    <!-- Terms (Draggable) -->
                    <div class="flex-1 space-y-3" id="dnd-terms">
                        ${terms.map(t => `
                            <div class="draggable p-3 bg-blue-50 border-2 border-blue-200 text-blue-800 rounded-lg font-bold text-center shadow-sm" 
                                 draggable="true" ondragstart="drag(event)" id="${t.id}">
                                ${t.term}
                            </div>
                        `).join('')}
                    </div>
                    
                    <!-- Meanings (Dropzones) -->
                    <div class="flex-1 space-y-3" id="dnd-meanings">
                        ${meanings.map(m => `
                            <div class="dropzone p-3 bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg text-gray-600 min-h-[50px] flex items-center justify-center relative" 
                                 ondrop="drop(event, '${m.id}')" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
                                <span class="text-sm z-0 pointer-events-none">${m.meaning}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function dragEnter(ev) {
            ev.preventDefault();
            if(ev.target.classList.contains('dropzone')) {
                ev.target.classList.add('hover');
            }
        }

        function dragLeave(ev) {
            if(ev.target.classList.contains('dropzone')) {
                ev.target.classList.remove('hover');
            }
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev, targetId) {
            ev.preventDefault();
            
            // Manage dropzone classes
            let dropzone = ev.target;
            if(!dropzone.classList.contains('dropzone')) {
                dropzone = dropzone.closest('.dropzone');
            }
            if(dropzone) dropzone.classList.remove('hover');

            const draggedId = ev.dataTransfer.getData("text");
            
            // Check if match is correct
            if (draggedId === targetId) {
                const draggedElement = document.getElementById(draggedId);
                // Success visual highly enhanced
                dropzone.innerHTML = '';
                dropzone.classList.remove('border-dashed', 'border-gray-300', 'bg-gray-50');
                dropzone.classList.add('success-anim'); // Uses new green animation
                
                draggedElement.draggable = false;
                draggedElement.classList.remove('cursor-grab', 'bg-blue-50', 'border-blue-200', 'text-blue-800');
                draggedElement.classList.add('bg-transparent', 'border-none', 'text-green-900', 'w-full', 'text-lg');
                
                dropzone.appendChild(draggedElement);
                dropzone.innerHTML += '<span class="absolute -right-3 -top-3 text-2xl animate-bounce">✨</span>';
                
                dndMatches++;
                if(dndMatches === totalDndPairs) {
                    const container = document.getElementById('game-container');
                    container.style.boxShadow = "0 0 50px rgba(34, 197, 94, 0.4)";
                    setTimeout(() => {
                        container.style.boxShadow = "";
                        triggerVictory();
                    }, 800);
                }
            } else {
                // Incorrect feedback enhanced with shake
                if(dropzone) {
                    dropzone.classList.add('shake-anim');
                    setTimeout(() => { 
                        dropzone.classList.remove('shake-anim'); 
                    }, 400);
                }
            }
        }

        // --- REWARDS ---
        function triggerVictory() {
            state.money += REWARD;
            saveState();
            
            document.getElementById('victory-screen').classList.add('active');
            
            // Simple Confetti effect simulation via DOM elements
            createConfetti();
        }

        function nextGame() {
            loadRandomGame();
        }

        function createConfetti() {
            const colors = ['#fde047', '#3b82f6', '#22c55e', '#ef4444'];
            for(let i=0; i<30; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '10px';
                conf.style.height = '10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                conf.style.left = '50%';
                conf.style.top = '50%';
                conf.style.borderRadius = '2px';
                conf.style.zIndex = '100';
                conf.style.pointerEvents = 'none';
                
                let angle = Math.random() * Math.PI * 2;
                let velocity = 50 + Math.random() * 100;
                let tx = Math.cos(angle) * velocity;
                let ty = Math.sin(angle) * velocity - 50; // Bias upward

                conf.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random()*500,
                    easing: 'cubic-bezier(.17,.67,.83,.67)'
                });

                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 1500);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
